# ============================================================================
# Parrot 独立 WebUI：现有域名 HTTPS server 块中的「新增增量片段」
# ============================================================================
#
# 用途：在用户**已有的** Parrot 域名 server 块里，只新增 /webui/ 分流。
#
# 硬约束：
#   - 这是增量片段，不是新的 server 块：不要新 listen 端口、不要新 server_name、
#     不要新建域名或子域名，也不要替换整个 server 块。
#   - 不改、不覆盖原有 /、/v1、/api/management/v1、/mcp 等既有 location 规则。
#   - 保留 /webui/ 前缀：proxy_pass 后面**不要**加 URI（尤其不要以 / 结尾），
#     否则前缀会被剥掉，BFF 与 Cookie Path 全部错位。禁止同时使用"剥前缀"方案。
#   - 3000 只用于本机反向代理回环目标，禁止对外发布或做成公网直连入口。
#
# 使用方式（二选一）：
#   a) 把本片段内容原样粘进现有 server 块；
#   b) 保存为 /etc/nginx/snippets/parrot-webui.conf，在现有 server 块内加一行：
#        include /etc/nginx/snippets/parrot-webui.conf;
#
# 上线前必须做（下面所有 parrot.example.com 都要替换成用户实际使用的原 Parrot 域名，现场确认）：
#   sudo nginx -t                 # 语法校验；失败则不要 reload
#   sudo nginx -s reload          # 平滑生效（或 systemctl reload nginx / service nginx reload）
#
# 回滚：
#   删除 include 行（或本片段）→ sudo nginx -t → sudo nginx -s reload
#   不要通过删除原 server 块或改动原 API 规则来"回滚"。
#
# 说明：WebUI 侧 WEBUI_TRUST_PROXY（见 .env.example）必须与实际入口地址/CIDR 一致。
#       若前面还有 CDN/其它代理，先在现有入口按实际来源配置 real-IP，再传递已验证的客户端 IP；
#       本片段用 $remote_addr 覆盖客户端自带的 X-Forwarded-For，不直接信任其伪造值。
# ============================================================================

# /webui → /webui/（保留尾斜杠；深链接刷新/书签都依赖它）
location = /webui {
    if ($host != parrot.example.com) { return 404; }
    return 308 /webui/;
}

# 容器健康检查只给内部用，不对公网开放（与 BFF 的 /webui/health/live、/webui/health/ready 对应）
location = /webui/health { return 404; }
location ^~ /webui/health/ { return 404; }

# 其余 /webui/ 全部转发给独立 WebUI 容器（仅宿主回环 127.0.0.1:3000）
location ^~ /webui/ {
    # 防止在 default_server 或 IP:443 访问时落进本项目
    if ($host != parrot.example.com) { return 404; }

    # 关键：proxy_pass 末尾没有 URI，路径原样透传，/webui/ 前缀保留给 BFF
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    # 覆盖客户端可伪造的头，只发入口已知的事实
    proxy_set_header Host parrot.example.com;
    proxy_set_header X-Forwarded-Host parrot.example.com;
    proxy_set_header X-Forwarded-Proto https;
    # 单层公网入口示例：用真实对端地址覆盖客户端 XFF，不把 $proxy_add_x_forwarded_for 直接透传
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # OAuth 导入最大 5MiB，与 BFF 的 WEBUI_OAUTH_IMPORT_BODY_LIMIT_BYTES 对齐
    client_max_body_size 5m;
    proxy_cache off;
    # 避免 OAuth 回填 URL/查询参数里的临时秘密进入默认 URI 访问日志
    access_log off;

    # 不在这里加 add_header / 缓存策略：静态资源与 index.html 的缓存头由 BFF 决定
}

# ============================================================================
# 生效后至少验证以下几条（在宿主上执行，域名替换为真实值）：
#
#   curl -sSI https://parrot.example.com/webui      | head -1   # 期望 308
#   curl -sSI https://parrot.example.com/webui/     | head -1   # 期望 200
#   curl -sS  https://parrot.example.com/webui/health/live      # 期望 404（健康检查不对外）
#   curl -sSI https://parrot.example.com/v1/models   | head -1   # 原推理入口回归检查
#   curl -sSI https://parrot.example.com/api/management/v1/meta | head -1  # 原管理 API 回归检查
#   curl -sSI https://parrot.example.com/            | head -1   # 原首页回归检查
#
# 公网端口拒绝验证（必须在另一台公网机器上做，不能只在本机测）：
#   curl -sS --max-time 5 http://<宿主公网IPv4>:3000/webui/health/live   # 期望连接失败
#   curl -sS --max-time 5 "http://[<宿主公网IPv6>]:3000/webui/health/live" # 期望连接失败
# 本机侧确认端口只发布到回环：
#   docker compose config | grep -A2 published   # 只允许 127.0.0.1
#   ss -ltnp | grep ':3000'                       # 不应出现 0.0.0.0:3000 或 [::]:3000
# ============================================================================
